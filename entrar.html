<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acer / Entrar</title>
    <link rel="shortcut icon" href="icones/acer_logo_icon_168703-verde.webp" type="image/x-icon">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="cadastro-responsive.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
</head>
<body>

        <main>
          <section id="container-formulario-cadastro">
            <a href="cadastro.html" class="btn-voltar">
              <i class="material-symbols-outlined">arrow_back</i>
             </a>
              <h1>Entrar</h1>
                  <form method="post" action="">
          
                      <p>
                        <label for="nome_cad">Seu Nome:</label>
                        <br>
                        <input id="nome_cad" name="nome_cad" required="required"  type="text" size="30" placeholder="nome" />
                      </p>
          
                      <p>
                        <label for="email_cad">Seu E-mail:</label> <br>
                        <input id="email_cad" name="email_cad" required="required" type="email" size="30" placeholder="usuario@usuario.com"/>
                      </p>
          
                      <p>
                        <label for="senha_cad">Sua Senha:</label> <br>
                        <input id="senha_cad" name="senha_cad" required="required" type="password" size="30" placeholder="ex. 1234"/>
                      </p>
          
                      <p>
                        <input type="submit" value="Entrar"/>
                      </p>
          
                    </form>
          </section>
        </main>
   
</body>
</html>
